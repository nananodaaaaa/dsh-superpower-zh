# dsh-ppt-plugin bundle patch: mounts the three PPT skills into a dsh
# profile's host composition, as their own layer.
#
# Split out of `dsh-superpower-zh` deliberately: these bundles are a different
# product (image-generation driven slide work with its own scripts, reference
# images, and Python toolchain), they are heavy on disk, and a deployment may
# want one without the other. Two independent bundles are also the rule this
# family follows everywhere else — one package, one concern, one patch layer.
#
# Same two-row shape as `dsh-superpower-zh`, and the two coexist because each
# registers its OWN `skill-filesystem` provider name; a provider name may only
# be registered once per process, so reusing `superpower-zh` (or the base
# bundle's `filesystem`) here would collide.
#
# `customSkillDirs` is COMPUTED, not assumed, for the same two reasons
# documented in the superpower-zh patch:
#   1. the skill provider resolves a relative entry against the DSH process's
#      CWD, which is neither this file nor the profile;
#   2. `baseUrl` is not this package's directory — a profile bundle's patch is
#      applied by the Include mounting the composed profile, so `baseUrl` is
#      the PROFILE directory.
# Both mistakes fail silently as "zero skills discovered". The expression
# therefore builds candidate roots and returns the first one that really holds
# a skill bundle.

- insert:
    - id: skill-filesystem-ppt-plugin
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: ppt-plugin
        includeDefaultRoots: false
        customSkillDirs:
          - !!js >-
              (() => { const fs = process.getBuiltinModule('node:fs'); const path = process.getBuiltinModule('node:path'); const url = process.getBuiltinModule('node:url'); const REL = 'node_modules/dsh-ppt-plugin/skills'; const holds = (root) => { try { return fs.readdirSync(root, { withFileTypes: true }).some((entry) => entry.isDirectory() && fs.existsSync(path.join(root, entry.name, 'SKILL.md'))); } catch { return false; } }; const roots = []; if (typeof baseUrl === 'string' && baseUrl) { try { roots.push(path.join(url.fileURLToPath(new URL('./', baseUrl)), REL)); } catch {} } const home = process.env.DSH_HOME; if (home) roots.push(path.join(home, 'profiles', 'web', REL)); roots.push(path.resolve(REL)); for (const root of roots) if (holds(root)) return root; return roots[0]; })()
        watch: true

    - id: ppt-plugin
      name: ./index.js
