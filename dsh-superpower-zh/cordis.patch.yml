# dsh-superpower-zh bundle patch: mounts the Superpower-ZH skill family into a
# dsh profile's host composition, next to every other profile bundle
# (@nanmicoder/dsh-agent-teams included — the two are independent rows).
#
# Two rows, two jobs:
#   1. `skill-filesystem` — a SECOND filesystem skill provider (its own
#      `providerName`, so it cannot collide with the base bundle's
#      `filesystem` provider). It contributes this package's skill bundles to
#      the shared `skills` registry, which is what `tool-skill` already
#      renders into each session's catalog. `includeDefaultRoots: false` makes
#      it isolated: the base provider keeps owning the project, user, and
#      bundled roots, so nothing is scanned twice.
#   2. `superpower-zh` — the package's own plugin entry, registering the
#      always-on policy section into `systemPrompt`.
#
# THE `customSkillDirs` PATH IS COMPUTED, NOT ASSUMED. Two separate traps:
#
#   1. `dsh-skill-filesystem` does `customSkillDirs.map((root) => resolve(root))`,
#      i.e. a relative entry resolves against the DSH process's CWD — never
#      against this file and never against the profile. A relative `./skills`
#      silently discovers ZERO skills unless the process happens to be started
#      from one exact directory (no boot error: the directory is just absent).
#   2. `baseUrl` is NOT this package's directory. A profile bundle's patch list
#      is applied by the Include that mounts the composed profile, so `baseUrl`
#      is the PROFILE directory. `new URL('./skills/', baseUrl)` therefore
#      resolved to `<profile>/skills`, which does not exist — the same silent
#      zero-skills failure with a different cause.
#
# So the expression builds candidate roots and returns the first one that
# actually holds a skill bundle (a child directory carrying `SKILL.md`), which
# is self-validating rather than dependent on any single assumption about the
# loader's context. Measured behaviour: with the bundle installed at
# `<profile>/node_modules/<package>/` — the only place a profile bundle ever
# lives — the first candidate resolves exactly that path.
#
# `name: ./index.js` needs none of this: the profile loader anchors relative
# inserted names to THIS file's directory before the loader ever sees them.
#
# Both rows publish nothing, so neither needs an `isolate` realm; a profile
# bundle is one instance per process, which is exactly the lifetime the shared
# skill registry and prompt registry want. The skills are inert text until an
# agent calls the `skill` tool, so they add catalogue lines only, never tools.

- insert:
    - id: skill-filesystem-superpower-zh
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: superpower-zh
        includeDefaultRoots: false
        customSkillDirs:
          - !!js >-
              (() => { const fs = process.getBuiltinModule('node:fs'); const path = process.getBuiltinModule('node:path'); const url = process.getBuiltinModule('node:url'); const REL = 'node_modules/dsh-superpower-zh/skills'; const holds = (root) => { try { return fs.readdirSync(root, { withFileTypes: true }).some((entry) => entry.isDirectory() && fs.existsSync(path.join(root, entry.name, 'SKILL.md'))); } catch { return false; } }; const roots = []; if (typeof baseUrl === 'string' && baseUrl) { try { roots.push(path.join(url.fileURLToPath(new URL('./', baseUrl)), REL)); } catch {} } const home = process.env.DSH_HOME; if (home) roots.push(path.join(home, 'profiles', 'web', REL)); roots.push(path.resolve(REL)); for (const root of roots) if (holds(root)) return root; return roots[0]; })()
        watch: true

    - id: superpower-zh
      name: ./index.js
