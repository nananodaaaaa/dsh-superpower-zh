# dsh-superpower-zh bundle patch: mounts the Superpower-ZH skill family into a
# dsh profile's host composition, next to every other profile bundle
# (@nanmicoder/dsh-agent-teams included — the two are independent rows).
#
# Two rows, two jobs:
#   1. `skill-filesystem` — a SECOND filesystem skill provider (its own
#      `providerName`, so it cannot collide with the base bundle's
#      `filesystem` provider). It contributes this package's skill bundles to
#      the shared `skills` registry, which is what `tool-skill` already
#      renders into each session's catalog. `includeDefaultRoots: false` makes
#      it isolated: the base provider keeps owning the project, user, and
#      bundled roots, so nothing is scanned twice.
#   2. `superpower-zh` — the package's own plugin entry, registering the
#      always-on policy section into `systemPrompt`.
#
# THE `customSkillDirs` PATH MUST BE ABSOLUTE. `dsh-skill-filesystem` does
# `customSkillDirs.map((root) => resolve(root))`, i.e. it resolves a relative
# entry against the DSH process's CWD — never against this file, and never
# against the profile. A relative `./skills` therefore works only when the
# process happens to be launched from this package's parent directory, and
# silently discovers ZERO skills otherwise (no boot error: the directory is
# simply absent). That is why `new URL('./skills/', baseUrl)` is used instead.
#
# `name: ./index.js` needs none of this: the profile loader anchors relative
# inserted names to THIS file's directory before the loader ever sees them.
#
# Both rows publish nothing, so neither needs an `isolate` realm; a profile
# bundle is one instance per process, which is exactly the lifetime the shared
# skill registry and prompt registry want. The skills are inert text until an
# agent calls the `skill` tool, so they add catalogue lines only, never tools.

- insert:
    - id: skill-filesystem-superpower-zh
      name: '@deepseek-ai/dsh-skill-filesystem'
      config:
        providerName: superpower-zh
        includeDefaultRoots: false
        customSkillDirs:
          - !!js >-
              process.getBuiltinModule('node:url').fileURLToPath(new URL('./skills/', baseUrl ?? process.cwd() + '/'))
        watch: true

    - id: superpower-zh
      name: ./index.js
